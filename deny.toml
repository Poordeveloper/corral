[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Corral ships Apache-2.0 OR MIT. Permissive inbound licences only; anything
# else needs a deliberate decision, not a silent allow entry.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
