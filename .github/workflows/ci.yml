# CI calls the repository scripts and adds only the PR-metadata checks that
# docs/ENGINEERING_WORKFLOW.md Appendix A closed-lists. It never re-implements
# test selection, quarantine, compatibility, or release logic: that lives in
# scripts/ so the same gate runs locally and here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pinned gate tool: an unpinned install would freeze whatever version the
# cache first captured while local machines float, so "verify is green" would
# stop meaning one thing. Bump deliberately, in its own change.
env:
  CARGO_DENY_VERSION: 0.20.2

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push cancels the stale run; a push to main never cancels
  # the previous merge's verify, so every merged commit keeps a completed
  # verification record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # gpui's Linux backends link against these at build time. Environment
      # setup only: the gate itself stays ./scripts/verify (PR9 plan, D4).
      - name: Desktop build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig1-dev

      - name: Install cargo-deny
        run: |
          cargo deny --version 2>/dev/null | grep -qF "cargo-deny $CARGO_DENY_VERSION" \
            || cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - run: ./scripts/verify

  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional commits
        run: ./scripts/check-commit-messages "${{ github.event.pull_request.base.sha }}"

      - name: Change size (advisory)
        run: ./scripts/loc-advisory "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The step renders the summary and then propagates the script's exit
      # code unchanged: a red check is the machine half of the human-merge
      # gate. Agents cannot merge over it; after reviewing, the maintainer
      # merges with admin authority (Workflow §8).
      - name: Risk surface
        run: |
          set +e
          out="$(./scripts/check-risk-surface "${{ github.event.pull_request.base.sha }}")"
          status=$?
          echo "$out"
          if [ "$status" -eq 10 ]; then
            {
              echo "## HUMAN_REVIEW_REQUIRED"
              echo ""
              echo '```'
              echo "$out"
              echo '```'
              echo ""
              echo "This pull request is merged by a human regardless of the class claimed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Schema / durable-event gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-schema-gate "${{ github.event.pull_request.base.sha }}"

      - name: Quarantine leases
        run: ./scripts/check-quarantines
