# macOS coverage and scheduled evidence amplification.
#
# Per-PR CI runs on Linux; macOS runs after merge and on a schedule, and is
# required by scripts/verify-release. Local development already verifies on
# macOS, and a private repository bills macOS runners at ten times the rate.
#
# A failure here never retroactively invalidates merged history. It produces a
# finding, may freeze the affected owner's autonomous merge pending triage, and
# follows the P1 process if it is a real correctness defect
# (docs/ENGINEERING_WORKFLOW.md §7).
name: Scheduled

# Keep in lockstep with ci.yml so Linux and macOS verify with the same tool.
env:
  CARGO_DENY_VERSION: 0.20.2

on:
  push:
    branches: [main]
  schedule:
    # Weekly macOS verification, and nightly fuzzing: the two amplify
    # different things and are worth different cadences.
    - cron: "0 6 * * 1"
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  verify-macos:
    name: verify (macos)
    # Not on the nightly cron: a macOS runner bills at ten times the rate, and
    # what the nightly schedule exists for is fuzzing.
    if: github.event.schedule != '0 3 * * *'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-deny
        run: |
          cargo deny --version 2>/dev/null | grep -qF "cargo-deny $CARGO_DENY_VERSION" \
            || cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - run: ./scripts/verify

  quarantine-leases:
    name: quarantine leases
    if: github.event.schedule != '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-quarantines

  # The third layer of the terminal's fuzz requirement (ADR 0003 D9). It
  # discovers; it is never the only coverage of a merge-critical invariant,
  # which is what the deterministic corpus in ./scripts/verify is for. A crash
  # here is a P1, and its minimized reproducer joins that corpus — which is
  # how a finding becomes something that cannot come back quietly.
  fuzz-terminal:
    name: fuzz (terminal)
    # Nightly only: the weekly macOS run does not need to carry this too.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The script owns target selection, seeds, and limits; this job only
      # calls it (AGENTS.md §Verification).
      - run: ./scripts/fuzz-terminal 1800

      - name: Keep any crash a run found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-terminal-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
