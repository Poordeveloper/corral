[package]
name = "corral"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "corral"
path = "src/main.rs"

# The sanctioned mock-provider harness. Behind `test-support` so it is never
# built into a normal install: it is a stand-in for a coding agent, and the
# end-to-end suite reaches it through `CARGO_BIN_EXE_corral-mock-provider`
# exactly as it reaches the real binaries.
[[bin]]
name = "corral-mock-provider"
path = "tests/support/mock_provider.rs"
required-features = ["test-support"]

[dependencies]
clap = { workspace = true }
corral-client = { workspace = true }
corral-protocol = { workspace = true }
# The hook relay resolves the endpoint the same way every other Corral process
# does. A shim that carried a socket path from an injected file would point a
# later daemon at a pathname an earlier one chose (ADR 0001 D1).
corral-rendezvous = { workspace = true }
# The terminal surfaces this binary drives: the session list, and the
# attachment `attach` and `new` hand the terminal over to.
corral-tui = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The isolation contract: a private account and staged, validated binaries.
corral-e2e = { workspace = true }
corral-protocol = { workspace = true }
# Writing to a running daemon's registry the way another process would. Going
# through SQLite is what makes the daemon see the change: a byte-level rewrite
# would depend on its page cache noticing.
rusqlite = { workspace = true }
# The session list only exists on a terminal, so the tests that drive it
# allocate one. The same vendored pty the daemon already uses, so it adds no
# supply chain; the alternatives were an unsafe `openpty` in the harness, which
# this crate forbids, and not covering the surface end to end at all.
portable-pty = { workspace = true }
# Integration tests drive real daemons, so they need to send real signals.
rustix = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
test-support = ["corral-client/test-support", "corral-rendezvous/test-support"]


[lints]
workspace = true
