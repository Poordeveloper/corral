[package]
name = "corral"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "corral"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
corral-client = { workspace = true }
corral-protocol = { workspace = true }
# Raw mode and the terminal's own size: no standard-library API exposes either.
rustix = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
corral-protocol = { workspace = true }
# Writing to a running daemon's registry the way another process would. Going
# through SQLite is what makes the daemon see the change: a byte-level rewrite
# would depend on its page cache noticing.
rusqlite = { workspace = true }
# Integration tests drive real daemons, so they need to send real signals.
rustix = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
test-support = ["corral-client/test-support"]


[lints]
workspace = true
