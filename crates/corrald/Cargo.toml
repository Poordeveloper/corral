[package]
name = "corrald"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "corrald"
path = "src/lib.rs"

[[bin]]
name = "corrald"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# The daemon owns shared session truth, so it speaks the domain directly.
corral-core = { workspace = true }
corral-protocol = { workspace = true }
corral-rendezvous = { workspace = true }
corral-state = { workspace = true }
# setsid: the daemon detaches itself, and no standard-library API exposes it.
rustix = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
test-support = ["corral-rendezvous/test-support"]


[lints]
workspace = true
