# Codex screen rules, measured 2026-09-02 and 2026-09-03 on 0.152.0
# (docs/references/2026-09-02-pr8-attention-matrix.md).
#
# A rule asserts a person-visible state only where both halves hold: its own
# `sealed_by`, and a runtime running one of `sealed_versions` (ADR 0015 D6,
# grill Q13/Q14).
schema = 1
min_engine_version = 1
version = "2026.09.03.1"
provider = "codex"
sealed_versions = ["0.152.0"]

# The title announces the block, focused or not, and blinks between two
# glyphs; the rule matches the words, not the glyph (noise catalog
# codex.title.blink).
[[rule]]
id = "action-required-title"
sealed_by = "docs/evidence/pr8-attention-semantics-2026-09-03.md"  # matrix X2, X3, X4; negatives X7, X9
asserts = "needs_input"
region = "osc_title"
all = ["Action Required"]
priority = 20

[[rule]]
id = "approval-dialog"
sealed_by = "docs/evidence/pr8-attention-semantics-2026-09-03.md"  # matrix X2, X3
asserts = "needs_input"
region = "bottom_non_empty_lines"
lines = 12
all = ["Would you like to run the following command?", "Press enter to confirm or esc to cancel"]
priority = 19

[[rule]]
id = "composer-idle"
sealed_by = "docs/evidence/pr8-attention-semantics-2026-09-03.md"  # matrix X1, X5, X7, X10
asserts = "turn_complete"
region = "bottom_non_empty_lines"
lines = 3
all = ["Ask Codex to do anything"]
none = ["esc to interrupt"]
priority = 5

# Diagnostic only (grill Q14).
[[rule]]
id = "working-line"
asserts = "working"
region = "bottom_non_empty_lines"
lines = 6
all = ["esc to interrupt"]
priority = 1
