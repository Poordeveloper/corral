# Claude Code screen rules, measured 2026-09-02 on 2.1.258
# (docs/references/2026-09-02-pr8-attention-matrix.md).
#
# A rule asserts a person-visible state only where both halves hold: its own
# `sealed_by`, and a runtime running one of `sealed_versions`. 2.1.259 is not
# here — the second run measured compaction and failure on it, not these
# dialogs — so on 2.1.259 every rule below is evaluated, counted, and asserts
# nothing (ADR 0015 D6, grill Q13/Q14).
schema = 1
min_engine_version = 1
version = "2026.09.03.1"
provider = "claude"
sealed_versions = ["2.1.258"]

# The three dialogs share one structure: the `❯ 1.` option list under a rule,
# the mode bar gone, the dialog's own last row. The permission words alone
# appear in ordinary output (matrix C9), so the mode bar's absence is the gate.
[[rule]]
id = "permission-dialog"
sealed_by = "docs/evidence/pr8-attention-semantics-2026-09-03.md"  # matrix C2, C3; negative C9
asserts = "needs_input"
region = "bottom_non_empty_lines"
lines = 12
all = ["❯ 1.", "Esc to cancel"]
none = ["manual mode on", "auto mode on", "? for shortcuts", "esc to interrupt"]
priority = 20

[[rule]]
id = "plan-approval"
sealed_by = "docs/evidence/pr8-attention-semantics-2026-09-03.md"  # matrix C5
asserts = "needs_input"
region = "bottom_non_empty_lines"
lines = 12
all = ["Would you like to proceed?", "❯ 1."]
none = ["manual mode on", "auto mode on", "? for shortcuts"]
priority = 21

# Unsealed on purpose: the trust dialog is screen-only, drawn before
# `SessionStart`, and the catalog holds it `unresolved`
# (`claude.trust-dialog.pre-session`). It is evaluated and asserts nothing.
[[rule]]
id = "trust-dialog"
asserts = "needs_input"
region = "bottom_non_empty_lines"
lines = 12
all = ["Accessing workspace:", "Enter to confirm"]
priority = 22

[[rule]]
id = "idle-prompt"
sealed_by = "docs/evidence/pr8-attention-semantics-2026-09-03.md"  # matrix C1, C7, C9, C10
asserts = "turn_complete"
region = "bottom_non_empty_lines"
lines = 4
all = ["? for shortcuts"]
none = ["esc to interrupt"]
priority = 5

# Diagnostic only, by decision: activity and hooks carry Working (grill Q14).
[[rule]]
id = "running-bar"
asserts = "working"
region = "bottom_non_empty_lines"
lines = 4
all = ["esc to interrupt"]
priority = 1
