[workspace]
resolver = "3"
members = [
    "crates/corral-core",
    "crates/corral-state",
    "crates/corral-protocol",
    "crates/corral-rendezvous",
    "crates/corral-client",
    "crates/corrald",
    "crates/corral",
]
# Vendored third-party code is built, never governed: a path dependency inside
# the repository would otherwise become an implicit member and inherit Corral's
# lints and formatting. Its `unsafe` is upstream's, and Corral-owned crates keep
# `#![forbid(unsafe_code)]` (docs/decisions/2026-08-24-pr3-spawn-gate.md).
exclude = ["third_party/portable-pty"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Poordeveloper/corral"

[workspace.dependencies]
corral-client = { path = "crates/corral-client" }
corral-core = { path = "crates/corral-core" }
corral-protocol = { path = "crates/corral-protocol" }
corral-rendezvous = { path = "crates/corral-rendezvous" }
corral-state = { path = "crates/corral-state" }

clap = { version = "4.5", features = ["derive"] }
# Vendored with one patch so a failed exec is reported as a spawn error
# instead of an ordinary child exit; provenance and removal condition in
# third_party/portable-pty/CORRAL_PATCHES.md. Alternatives considered: a
# Corral-authored unsafe PTY crate (needs an ADR and hands us
# controlling-terminal/EIO platform work), and a pinned WezTerm fork
# (adds a git source and a fork lifecycle for one reviewable hunk).
portable-pty = { path = "third_party/portable-pty" }
# The authoritative VT. Selected by spike S1 against four candidates: it is the
# only one that round-trips every dimension ROADMAP names, and the only pure
# Rust port of a serializing emulator (ADR 0003 D1). Its `unsafe` surface is
# named there and fuzzed before PR3 ships.
qwertty-term-vt = "0.4.0"
# The OS CSPRNG for attach tokens. Already in the tree under `uuid`, so this
# adds no supply chain; taken directly because a token needs a stated 128 bits,
# and a v4 UUID spends six of them on version and variant bits.
getrandom = "0.4"
# The registry store. `bundled` compiles SQLite from source so every platform
# runs the same engine and version, rather than whatever the host happens to
# ship.
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1", default-features = false, features = [
    "std",
    "fs",
    "process",
    # Raw mode for the interactive attach client: a terminal that keeps
    # line discipline would swallow the keystrokes an agent is waiting for.
    "termios",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }
# Corral-minted identity. v4 only: an identity is opaque, so nothing about
# what it names — not even when it was minted — may be recoverable from it
# (ADR 0002 D1).
uuid = { version = "1.18", default-features = false, features = ["std", "v4"] }
uzers = { version = "0.12", default-features = false }

# Enforcement for AGENTS.md §Rust. Every crate opts in with `[lints] workspace = true`.
# A crate that later needs unsafe at a platform boundary must be named in an ADR
# and drop out of this table deliberately, not by accident.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
