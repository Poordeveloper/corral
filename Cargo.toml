[workspace]
resolver = "3"
members = ["crates/corral-core", "crates/corral-protocol"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Poordeveloper/corral"

# Enforcement for AGENTS.md §Rust. Every crate opts in with `[lints] workspace = true`.
# A crate that later needs unsafe at a platform boundary must be named in an ADR
# and drop out of this table deliberately, not by accident.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
